name: Repair exact site from Drive
on:
  push:
    paths:
      - '.github/workflows/repair-from-drive.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public Drive folder
        run: |
          python -m pip install --quiet gdown
          mkdir -p /tmp/djp
          gdown --folder 'https://drive.google.com/drive/folders/1t4pHZ7zUwGsqo5T__dhrQKOg5IOgViao?usp=drive_link' -O /tmp/djp
      - name: Copy exact site files
        run: |
          SRC=$(find /tmp/djp -type f -name index.html -printf '%h\n' | head -n1)
          test -n "$SRC"
          cp -a "$SRC"/README.md .
          cp -a "$SRC"/index.html .
          cp -a "$SRC"/img .
          cp -a "$SRC"/video .
          test -f img/logo-palace-tree-gold.png
          test -f img/palace-front.jpg
          test -f video/palace-tour.mp4
          test -f video/bridal-set.mp4
      - name: Commit repaired site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html img video
          git commit -m 'Repair exact site files from public Drive'
          git push
