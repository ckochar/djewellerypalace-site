name: Repair site with verified Drive files
on:
  push:
    paths:
      - '.github/workflows/repair-direct.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate exact files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img video
          dl() { id="$1"; path="$2"; size="$3"; curl -L --fail --retry 3 --connect-timeout 15 --max-time 90 "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$path"; actual=$(stat -c%s "$path"); test "$actual" -eq "$size"; }
