          dl 19-YktOZxjNkLitDeDtlZ8Q1gBJHNJKD9 video/bridal-set.mp4
      - name: Remove bootstrap workflow and commit site
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy exact D Jewellery Palace site"
          git push origin main
